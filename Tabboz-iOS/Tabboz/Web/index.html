<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; media-src 'self' blob:">
  <title>Tabboz Simulator</title>
  <link rel="stylesheet" href="resources/css/98.css">
  <link rel="stylesheet" href="resources/css/novantotto.css">
  <link rel="stylesheet" href="mobile.css">
  <script src="resources/js/novantotto.js"></script>
  <script src="mobile.js"></script>
</head>
<body>
  <div id="screen" class="screen"></div>
  <div id="boot" class="window" role="status">
    <div class="title-bar"><div class="title-bar-text">Tabboz Simulator</div></div>
    <div class="window-body"><p>Caricamento del Tabboz...</p></div>
  </div>
  <script>
    var Module = {
      postRun: () => TabbozMobile.ready(),
      print: text => console.log(text),
      printErr: text => console.error(text),
      onAbort: reason => TabbozMobile.fail(String(reason))
    };
  </script>
  <script async src="zarrosim.js" onerror="TabbozMobile.fail('Il motore del gioco non è disponibile.')"></script>
</body>
</html>
